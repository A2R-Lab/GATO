# Twin of .github/workflows/docs.yml for the gh-pages BRANCH (replace that
# branch's .github/workflows/deploy-pages.yml with this file): a project-page
# edit republishes the same assembly, the landing from gh-pages plus the
# documentation tier built from main under /docs/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Project page (this branch)
        uses: actions/checkout@v4
      - name: Documentation sources (main)
        uses: actions/checkout@v4
        with:
          ref: w3-device-arms   # until W3+W4 merge; then main
          path: _main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the documentation tier from main
        run: |
          pip install -e "_main[docs]"
          python _main/docs/site/build.py --out _site/docs
      - name: Assemble site
        run: |
          cp index.html _site/
          cp -r static _site/
          cp .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
