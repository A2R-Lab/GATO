# CPU-only CI. Two jobs, no GPU, no secrets:
#
#   1. verify-receipt — validates the committed gpu-proof.json (signature via
#      github.com/{signer}.keys, source fingerprint, commit SHA, freshness,
#      allow_dirty policy). The GPU suite itself runs on the lab box via
#      test/run_gpu_proof.sh — this job is what lets GPU correctness gate
#      pushes without cloud GPUs. If no receipt is committed yet, the job
#      SKIPS gracefully (push-before-receipt is allowed; the receipt lands in
#      a follow-up commit and activates enforcement).
#
#   2. cpu-lane — the host-only test tier (packaging, math, reference
#      providers), so structural regressions are caught in ordinary CI.
#
# Trust model: the receipt is a signed attestation by a keyholder, not
# cryptographic proof of GPU execution — see pytest-gpu-proof's security docs.
name: verify-gpu-proof

on:
  push:
    branches: [main, cleanup-modernization]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: surface receipt decay (max_age_days) without waiting for a push

jobs:
  verify-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # commit-SHA ancestry check needs history
          # no submodules here: the verifier installs pytest-gpu-proof from PyPI
          # and fingerprints the parent tree only (gitlinks pin the submodules).

      - name: Check for a receipt
        id: receipt
        run: |
          if [ -f gpu-proof.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no gpu-proof.json yet — run test/run_gpu_proof.sh on the GPU box and commit the receipt"
          fi

      - uses: actions/setup-python@v5
        if: steps.receipt.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: Install pytest-gpu-proof (PyPI)
        if: steps.receipt.outputs.present == 'true'
        run: pip install "pytest-gpu-proof==0.4.0" pyyaml  # pinned: schema/policy/verifier move together

      - name: Verify receipt
        if: steps.receipt.outputs.present == 'true'
        run: |
          gpu-proof verify \
            --receipt gpu-proof.json \
            --repo . \
            --policy test/gpu-proof-policy.yaml \
            --expected-skips test/expected_skips.txt \
            --require-gpu

  cpu-lane:
    runs-on: ubuntu-latest
    steps:
      # submodules: recursive on a credential-less runner IS the fresh-clone gate:
      # the public install path (README) must work without a GitHub SSH key.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GATO (python package + full host-tier test deps, no CUDA build)
        run: pip install -e ".[test,dev]"   # pin/mujoco/scipy/gymnasium: no host test may skip for a missing dep

      - name: Host-only test tier (no silent skips)
        run: |
          python -m pytest -m "not gpu and not slow" -q -rs --junitxml=host-tier.xml
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("host-tier.xml").getroot()
          skipped = [(tc.get("classname"), tc.get("name"), tc.find("skipped").get("message"))
                     for tc in root.iter("testcase") if tc.find("skipped") is not None]
          for s in skipped:
              print("SKIPPED:", *s)
          if skipped:
              sys.exit("cpu-lane: %d host-tier test(s) skipped — a skip proves nothing; fix the dependency or the gate" % len(skipped))
          print("cpu-lane: 0 skips")
          PY
